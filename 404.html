<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Luis Manuel Macías Patiño</title><meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%230D141B'/%3E%3Cpath d='M6 38 C16 30 22 30 32 36 S48 42 58 30' stroke='%23F0B347' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: hoja técnica de instrumento. Columna central de 1120px, paneles de lectura con escala, proyectos como fichas de ingeniería. */
:root{
  --paper:#EDF1F4; --panel:#FFFFFF; --ink:#13202B; --muted:#56646F; --line:#C8D1D9;
  --amber:#C98A12; --amber-ink:#875800; --data:#1D6C88; --grid:rgba(29,108,136,.07);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D141B; --panel:#151F29; --ink:#E5EBF0; --muted:#94A2AE; --line:#283744;
  --amber:#F0B347; --amber-ink:#F0B347; --data:#62B5D2; --grid:rgba(98,181,210,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D141B; --panel:#151F29; --ink:#E5EBF0; --muted:#94A2AE; --line:#283744;
  --amber:#F0B347; --amber-ink:#F0B347; --data:#62B5D2; --grid:rgba(98,181,210,.06); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1;text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800;text-transform:uppercase}
h3{font-size:1.7rem;font-weight:600;text-transform:uppercase}
p{margin:0}
.eyebrow{font:500 .75rem/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber-ink)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font:800 1.35rem/1 var(--display);text-transform:uppercase;text-decoration:none;letter-spacing:.03em;white-space:nowrap}
.brand span{color:var(--amber-ink)}
.nav-right{display:flex;align-items:center;gap:16px;min-width:0}
.nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;font:500 .78rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em}
.nav ul a{display:inline-block;padding:9px 8px;text-decoration:none;color:var(--muted);border-radius:3px}
.nav ul a:hover,.nav ul a.active{color:var(--ink)}
.nav ul a.active{box-shadow:inset 0 -2px 0 var(--amber)}
.motion-btn{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:6px 10px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--muted);font:500 .72rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.motion-btn:hover{color:var(--ink);border-color:var(--muted)}
.motion-btn .ico{width:10px;height:10px;display:inline-block;background:linear-gradient(90deg,currentColor 35%,transparent 35% 65%,currentColor 65%)}
.motion-btn[aria-pressed="true"] .ico{background:currentColor;clip-path:polygon(0 0,100% 50%,0 100%)}
.skip{position:absolute;left:12px;top:-60px;z-index:20;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:3px;text-decoration:none}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}
section[id],header[id]{scroll-margin-top:64px}
@media (max-width:900px){.motion-btn .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.motion-btn{min-width:36px;justify-content:center}}
@media (max-width:720px){.nav .hide-sm{display:none}.nav ul a{padding:9px 6px;font-size:.7rem}.nav-right{gap:6px}}
@media (max-width:500px){.nav .hide-xs{display:none}}
@media (max-width:380px){.brand{font-size:1.1rem}.nav ul a{padding:9px 4px;letter-spacing:.02em}}

/* hero */
.hero .wrap{display:grid;grid-template-columns:1.25fr .9fr;gap:48px;align-items:center;padding-block:72px 56px}
.hero h1{font-size:clamp(2.8rem,8vw,6rem);font-weight:800;text-transform:uppercase;margin:14px 0 12px}
.role{font:600 clamp(1.35rem,3vw,1.9rem)/1.1 var(--display);text-transform:uppercase;color:var(--amber-ink);letter-spacing:.02em;margin-bottom:12px;text-wrap:balance}
.where{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 .78rem/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:20px}
.where span+span::before{content:"·";margin-right:14px;color:var(--line)}
.readout dd .sep{color:var(--muted);font-weight:600}
.readout dd.pair{font-size:clamp(1.5rem,3.4vw,1.85rem)}
footer a{color:var(--ink)}
.lead{font-size:1.15rem;max-width:58ch}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:22px 0 28px;font:500 .82rem/1.3 var(--mono)}
.path span{border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:3px}
.path i{color:var(--amber-ink);font-style:normal}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:3px;font:600 .95rem/1 var(--body);text-decoration:none;border:1px solid var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--data);border-color:var(--data)}
.btn.ghost:hover{border-color:var(--amber);color:var(--amber-ink)}
.status{display:inline-flex;align-items:center;gap:8px;font:500 .78rem/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.led{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 25%,transparent)}
@media (prefers-reduced-motion:no-preference){.led{animation:blink 2.4s ease-in-out infinite}}
@keyframes blink{50%{opacity:.35}}

.readout{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.readout header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font:500 .72rem/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.readout dl{margin:0;display:grid;grid-template-columns:1fr 1fr}
.readout div{padding:18px 16px;border-bottom:1px solid var(--line)}
.readout div:nth-child(odd){border-right:1px solid var(--line)}
.readout div:nth-last-child(-n+2){border-bottom:0}
.readout dt{font:500 .72rem/1.35 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.readout dd{margin:0;font:800 2.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.readout dd small{font-size:1.1rem;color:var(--amber-ink)}
.scope-wrap{border-top:1px solid var(--line)}
.trace{display:block;width:100%;height:84px}
.scope-legend{display:flex;gap:16px;padding:8px 16px 12px;font:500 .68rem/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.scope-legend span{display:inline-flex;align-items:center;gap:6px}
.scope-legend i{width:14px;height:2px;background:var(--amber)}
.scope-legend i.raw{background:var(--muted);opacity:.6}
@media (max-width:880px){.hero .wrap{grid-template-columns:1fr;gap:36px;padding-block:48px 40px}}

/* sections */
section.block{padding-block:72px;border-top:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:1fr 1.2fr;gap:32px;align-items:end;margin-bottom:40px}
.sec-head p{max-width:60ch;color:var(--muted)}
@media (max-width:760px){.sec-head{grid-template-columns:1fr;gap:14px}}

/* feature cards */
.feature{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:28px;overflow:hidden}
.feature > *{min-width:0}
.f-text{padding:32px;display:flex;flex-direction:column;gap:16px}
.f-viz{padding:32px;border-left:1px solid var(--line);background:color-mix(in srgb,var(--paper) 55%,var(--panel));display:flex;flex-direction:column;justify-content:center;gap:18px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 .72rem/1 var(--mono);padding:5px 8px;border-radius:2px;border:1px solid var(--line);color:var(--muted)}
.f-id{display:flex;justify-content:space-between;gap:12px;font:500 .72rem/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.f-id b{color:var(--amber-ink);font-weight:500}
.f-text ul{margin:0;padding-left:18px;display:grid;gap:6px}
@media (max-width:880px){.feature{grid-template-columns:1fr}.f-viz{border-left:0;border-top:1px solid var(--line)}.f-text,.f-viz{padding:24px}}

/* funnel */
.funnel{display:grid;gap:14px}
.funnel .row{display:grid;gap:6px}
.funnel .lbl{display:flex;justify-content:space-between;gap:12px;font-size:.88rem}
.funnel .lbl b{font:600 1rem/1 var(--mono);font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--line);border-radius:1px;position:relative;overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--data);min-width:2px}
.bar.amber span{background:var(--amber)}
.scale{display:flex;justify-content:space-between;font:400 .68rem/1 var(--mono);color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{border:1px solid var(--line);background:var(--panel);padding:12px;border-radius:3px}
.metric b{display:block;font:800 1.9rem/1 var(--display);font-variant-numeric:tabular-nums}
.metric span{font:500 .7rem/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.metric .bar{height:5px;margin-top:10px}

/* architecture */
.arch{display:grid;gap:10px;font-size:.85rem}
.arch .layer{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:stretch}
.arch .k{font:500 .68rem/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center}
.arch .boxes{display:flex;flex-wrap:wrap;gap:6px}
.arch .box{border:1px solid var(--line);background:var(--panel);padding:8px 10px;border-radius:3px;font-family:var(--mono);font-size:.78rem}
.arch .box.hl{border-color:var(--amber);color:var(--amber-ink)}
.arch .shell{border:1px dashed var(--data);border-radius:4px;padding:12px;display:grid;gap:10px;position:relative}
.arch .shell::before{content:"docker compose";position:absolute;top:-9px;right:10px;background:color-mix(in srgb,var(--paper) 55%,var(--panel));padding:0 6px;font:500 .66rem/1.2 var(--mono);color:var(--data)}
@media (max-width:480px){.arch .layer{grid-template-columns:1fr}}

/* pipeline */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.9rem;counter-increment:s}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s,decimal-leading-zero);font:500 .78rem/1.6 var(--mono);color:var(--amber-ink)}
.big-stat{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big-stat b{font:800 3.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.big-stat span{color:var(--muted);font-size:.9rem}

/* bom tree */
.tree{width:100%;height:auto;display:block}
.tree text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.tree .node{fill:var(--panel);stroke:var(--data)}
.tree .node.top{stroke:var(--amber)}
.tree .edge{stroke:var(--line);fill:none}
.tree .lv{fill:var(--ink);font-weight:500}

/* small grid */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:1.35rem}
.card .fig{font:800 2rem/1 var(--display);color:var(--amber-ink);font-variant-numeric:tabular-nums}
.card p{font-size:.92rem;color:var(--muted)}
@media (max-width:900px){.grid3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.grid3{grid-template-columns:1fr}}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.compare div{border:1px solid var(--line);border-radius:3px;padding:8px 10px;font-size:.8rem}
.compare div b{display:block;font:600 .95rem/1.2 var(--mono)}
.compare div.after{border-color:var(--amber)}

/* repos */
.repos{margin-top:40px;display:grid;gap:14px}
.repo-list{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:960px){.repo-list{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.repo-list{grid-template-columns:1fr}}
.repo-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;font-size:.88rem}
.repo-list a,.repo-list .repo{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:4px;background:var(--panel);text-decoration:none;min-width:0}
.repo-list a:hover{border-color:var(--data)}
.repo-list .priv{border-style:dashed}
.repo-list .priv b{color:var(--ink)}
.repo-list b{font:500 .9rem/1.2 var(--mono);color:var(--data);overflow-wrap:anywhere}
.repo-list span{font-size:.85rem;color:var(--muted);flex:1}
.repo-list i{font:500 .7rem/1 var(--mono);font-style:normal;color:var(--muted)}

/* now */
.now{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:700px){.now{grid-template-columns:1fr}}
.now .card{flex-direction:row;gap:16px;align-items:flex-start}
.now .card .eyebrow{min-width:72px}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:118px;top:6px;bottom:6px;width:1px;background:var(--line)}
.timeline li{display:grid;grid-template-columns:104px 1fr;gap:28px;padding-bottom:28px;position:relative}
.timeline li::after{content:"";position:absolute;left:113px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--data)}
.timeline li.edu::after{border-color:var(--amber)}
.timeline .yr{font:500 .85rem/1.5 var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.timeline h3{font-size:1.4rem;margin-bottom:4px}
.timeline .org{font:500 .8rem/1.4 var(--mono);color:var(--amber-ink);margin-bottom:6px}
.timeline p{color:var(--muted);font-size:.93rem;max-width:62ch}
.legend{display:flex;gap:18px;font:500 .72rem/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:28px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;border:2px solid var(--data)}
.legend i.e{border-color:var(--amber)}
@media (max-width:560px){
  .timeline::before{left:5px}
  .timeline li{grid-template-columns:1fr;gap:4px;padding-left:28px}
  .timeline li::after{left:0}
  .timeline .yr{text-align:left}
}

/* skills */
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:960px){.skills{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.skills{grid-template-columns:1fr}}
.skills .card ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.skills .card li{font:500 .78rem/1 var(--mono);border:1px solid var(--line);padding:6px 8px;border-radius:2px}

.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0;border:1px solid var(--line);border-radius:4px;background:var(--panel);overflow:hidden;margin-top:28px}
.certs div{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;font-size:.9rem}
.certs div small{display:block;font:500 .68rem/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}

/* contact */
.contact{background:var(--ink);color:var(--paper);border-radius:4px;padding:48px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.contact h2{color:var(--paper)}
.contact p{color:color-mix(in srgb,var(--paper) 72%,var(--ink));margin-top:14px;max-width:48ch}
.ch{display:grid;gap:12px}
.ch .line{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid color-mix(in srgb,var(--paper) 25%,var(--ink));border-radius:3px;padding:14px 16px;flex-wrap:wrap}
.ch .line small{display:block;font:500 .7rem/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--amber);margin-bottom:6px}
.ch .line b{font:500 1.05rem/1.2 var(--mono);user-select:all}
.ch .line a,.ch .line button{font:600 .85rem/1 var(--body);color:var(--ink);background:var(--paper);border:0;border-radius:3px;padding:10px 14px;text-decoration:none;cursor:pointer}
.ch .line a:hover,.ch .line button:hover{background:var(--amber);color:#13202B}
@media (max-width:820px){.contact{grid-template-columns:1fr;padding:28px}}
/* method */
.method{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;counter-reset:m}
.method li{counter-increment:m;display:grid;gap:8px;align-content:start;padding:16px 12px;border-top:2px solid var(--line);border-radius:0 0 3px 3px;min-width:0}
.method li::before{content:counter(m,decimal-leading-zero);font:500 .78rem/1 var(--mono);color:var(--amber-ink)}
.method b{font:600 1.25rem/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em}
.method span{font-size:.9rem;color:var(--muted)}
@media (max-width:900px){.method{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.method{grid-template-columns:1fr}}

/* motion: loops quietly, every loop starts from the finished state */
.steps.flow li{padding-inline:8px;border-radius:3px}
.hourbar{height:6px;background:var(--line);border-radius:1px;overflow:hidden;margin-top:4px}
.hourbar span{display:block;height:100%;width:100%;background:var(--amber)}
.bar span{overflow:hidden}
.tree .flowdots circle{fill:var(--amber)}
.arch .shell{border:0;background:
  linear-gradient(90deg,var(--data) 55%,transparent 0) 0 0/12px 1px repeat-x,
  linear-gradient(90deg,var(--data) 55%,transparent 0) 0 100%/12px 1px repeat-x,
  linear-gradient(0deg,var(--data) 55%,transparent 0) 0 0/1px 12px repeat-y,
  linear-gradient(0deg,var(--data) 55%,transparent 0) 100% 0/1px 12px repeat-y}
@media (prefers-reduced-motion:no-preference){
  .flow > li{animation:glow calc(var(--n,5) * 1.1s) linear infinite;animation-delay:calc(var(--i,0) * 1.1s)}
  .hourbar span{animation:hours 7s ease-in-out infinite}
  .bar span::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--panel) 55%,transparent),transparent);transform:translateX(-100%);animation:shimmer 3.6s ease-in-out infinite}
  .arch .shell{animation:ants 1.4s linear infinite}
}
@media (prefers-reduced-motion:reduce){.tree .flowdots{display:none}}
.motion-off .flow > li,.motion-off .hourbar span,.motion-off .bar span::after,.motion-off .arch .shell,.motion-off .led{animation:none!important}
.motion-off .tree .flowdots{display:none}
@keyframes glow{0%,14%{background:color-mix(in srgb,var(--amber) 14%,transparent);border-top-color:var(--amber)}22%,100%{background:transparent;border-top-color:var(--line)}}
@keyframes hours{0%{width:100%}8%{width:0}85%,100%{width:100%}}
@keyframes shimmer{0%,40%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes ants{to{background-position:12px 0,-12px 100%,0 -12px,100% 12px}}

footer{padding-block:32px;font:400 .78rem/1.5 var(--mono);color:var(--muted)}
